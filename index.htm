<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ericha ❤️</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        /* Visual Beating Heart Effect */
        .heart {
            font-size: 80px;
            color: #ff3366;
            animation: beat 0.6s infinite alternate;
            margin-bottom: 20px;
        }
        @keyframes beat {
            to { transform: scale(1.15); }
        }
        .card {
            max-width: 500px;
            border: 1px dashed #ff3366;
            padding: 20px;
            border-radius: 10px;
            background: #1a1a1a;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.2);
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .visible { opacity: 1; }
        .divider { color: #ff3366; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="heart">❤️</div>
    <div class="card" id="letterCard">
        <div id="textContainer"></div>
    </div>

    <script>
        const gfName = "Ericha";
        const yourName = "Kian";
        const runtimeStr = "1 month";

        const lines = [
            `To my dearest ${gfName},<br><br>`,
            `Every second with you feels like adding a bright new line of code to my life, making everything work better.<br>`,
            `Thank you for bringing so much joy, patience, and warmth into my world.<br><br>`,
            `<div class="divider">————————————————————————————</div>`,
            `<strong>System Status: HAPPY MONTHSARY! 💕</strong><br>`,
            `Total runtime together: ${runtimeStr} of pure happiness.<br>`,
            `<div class="divider">————————————————————————————</div><br>`,
            `Forever & always,<br>`,
            `<strong>${yourName}</strong>`
        ];

        let currentLine = 0;
        let currentChar = 0;
        const container = document.getElementById('textContainer');
        const card = document.getElementById('letterCard');

        // Wait 3 seconds (simulating your heart animation delay) then show letter
        setTimeout(() => {
            card.classList.add('visible');
            typeWriter();
        }, 3000);

        function typeWriter() {
            if (currentLine < lines.length) {
                let line = lines[currentLine];
                // If it's an HTML tag/divider, inject it instantly instead of typing char-by-char
                if (line.startsWith('<')) {
                    container.innerHTML += line;
                    currentLine++;
                    setTimeout(typeWriter, 400);
                } else {
                    // Type regular characters
                    if (currentChar < line.length) {
                        // Check if we are passing a break tag mid-line
                        if (line.substring(currentChar, currentChar + 4) === '<br>') {
                            container.innerHTML += '<br>';
                            currentChar += 4;
                        } else {
                            container.innerHTML += line.charAt(currentChar);
                            currentChar++;
                        }
                        setTimeout(typeWriter, 25);
                    } else {
                        currentLine++;
                        currentChar = 0;
                        setTimeout(typeWriter, 200);
                    }
                }
            }
        }
    </script>
</body>
</html>
